name: Deploy Practice Site

on:
  workflow_run:
    workflows:
      - Validate and Deploy Challenge API
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Install API dependencies for browser tests
        working-directory: api
        run: npm ci

      - name: Lint application
        run: npm run lint

      - name: Test application
        run: npm test

      - name: Validate flashcard data
        run: npm run validate:data

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      # Generates any missing {slug}-fr.json; skips decks already translated.
      - name: Translate decks to French
        if: ${{ vars.AZURE_TRANSLATOR_REGION != '' }}
        working-directory: ${{ github.workspace }}
        env:
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ vars.AZURE_TRANSLATOR_REGION }}
        run: |
          if [ -z "$AZURE_TRANSLATOR_KEY" ]; then
            echo "AZURE_TRANSLATOR_KEY secret not set; skipping French translation."
            exit 0
          fi
          node tools/translate-decks.mjs

      - name: Build site
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_PUBLIC_API_BASE: ${{ vars.VITE_PUBLIC_API_BASE }}
        run: |
          before="$(sha256sum public/data/exams.json | cut -d ' ' -f 1)"
          npx tsc -b
          npx vite build
          after="$(sha256sum public/data/exams.json | cut -d ' ' -f 1)"
          test "$before" = "$after"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4