name: Exam date report refresh

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exam-date-report-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Refresh official study-guide dates
        run: node tools/refresh-study-guide-dates.mjs

      - name: Generate exam date report
        run: node tools/generate-exam-date-report.mjs

      - name: Test exam date report
        run: node --test tools/exam-date-report.test.mjs

      - name: Check exam date report
        run: node tools/generate-exam-date-report.mjs --check

      - name: Verify complete change scope
        id: scope
        shell: bash
        run: |
          changes="$RUNNER_TEMP/exam-date-report-changes"
          git diff --name-only -z HEAD > "$changes"
          git ls-files --others --exclude-standard -z >> "$changes"
          while IFS= read -r -d '' file; do
            case "$file" in
              catalog/study-guide-dates.json|EXAM-DATE-REPORT.md) ;;
              *)
                printf '::error::Unexpected changed file: %s\n' "$file"
                exit 1
                ;;
            esac
          done < "$changes"

          if git diff --quiet HEAD -- catalog/study-guide-dates.json EXAM-DATE-REPORT.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No exam date report updates." >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::Unable to determine whether report files changed."
              exit "$status"
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish validated update as a new pull request
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="automation/exam-date-report-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- catalog/study-guide-dates.json EXAM-DATE-REPORT.md
          git commit -m "docs: refresh exam date report" \
            -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"

          gh auth setup-git
          if ! git push --set-upstream origin "$branch"; then
            echo "::error::Branch push failed; inspecting remote state without retrying."
            git ls-remote --heads origin "refs/heads/$branch"
            gh pr list --state all --head "$branch" --json url,state
            exit 1
          fi

          body="$RUNNER_TEMP/exam-date-report-pr.md"
          cat > "$body" <<EOF
          Refreshes official Microsoft Learn study-guide metadata and regenerates the exam date report.

          Only \`catalog/study-guide-dates.json\` and \`EXAM-DATE-REPORT.md\` are changed.

          Validation passed:
          - \`node tools/refresh-study-guide-dates.mjs\`
          - \`node tools/generate-exam-date-report.mjs\`
          - \`node --test tools/exam-date-report.test.mjs\`
          - \`node tools/generate-exam-date-report.mjs --check\`
          - Complete tracked and untracked change-scope check

          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Review the dates and source links before merging. This workflow does not update existing PRs, force-push, or merge.
          EOF

          if ! url="$(gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
            --title "docs: refresh exam date report" --body-file "$body")"; then
            echo "::error::PR creation failed or is uncertain; inspecting existing PRs without retrying."
            gh pr list --state all --head "$branch" --json url,state
            exit 1
          fi
          printf 'Pull request: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
